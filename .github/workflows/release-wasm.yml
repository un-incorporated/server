# Build the chain-verifier WASM and publish it as GitHub Release assets.
# Fires on any version tag push (`v*.*.*`). Downstream consumer: www/
# (unincorporated.app mothership) pulls these assets by pinned tag via
# www/scripts/sync-wasm.sh.
#
# Trust-separation note: the spec tells frontends to load the verifier from
# a different origin than the chain API. Publishing through GitHub Releases
# with a signed artifact pipeline means an attacker who compromises the
# runtime server has to also compromise GitHub's release signing to swap
# the verifier out — substantially harder than breaking a single origin.
#
# Artifacts per release:
#   chain_verifier_wasm_bg.wasm   the verifier binary
#   chain_verifier_wasm.js        ES module glue (wasm-bindgen output)
#   chain-verifier.sha256         sha256 of the .wasm (reproducible-build check)
#
# Reproducibility: the sha256 inside the release should be stable across
# identical source checkouts on identical toolchains. If it drifts without
# a source change, investigate the build environment (Rust version, wasm-pack
# version) before publishing.

name: release-wasm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (must already exist)'
        required: true

permissions:
  contents: write  # required to upload to GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable) with wasm32 target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Build chain-verifier WASM
        run: bash crates/chain-verifier-wasm/build.sh

      - name: Stage release assets
        run: |
          mkdir -p release
          cp crates/chain-verifier-wasm/pkg/chain_verifier_wasm_bg.wasm release/
          cp crates/chain-verifier-wasm/pkg/chain_verifier_wasm.js      release/
          cp crates/chain-verifier-wasm/pkg/chain-verifier.sha256       release/
          echo "=== release/ contents ==="
          ls -la release/
          echo "=== sha256 ==="
          cat release/chain-verifier.sha256

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Disk-image filenames use dashes (GCE naming rules forbid
          # dots in image names): uninc-{role}-vX-Y-Z.tar.gz.
          # ghcr.io tags use dots (registry rules allow them):
          # ghcr.io/un-incorporated/proxy:vX.Y.Z. Both are needed in
          # the Release body below.
          echo "suffix=$(echo "${TAG}" | tr . -)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # Don't wipe the release on re-run — append / overwrite our assets.
          fail_on_unmatched_files: true
          files: |
            release/chain_verifier_wasm_bg.wasm
            release/chain_verifier_wasm.js
            release/chain-verifier.sha256
          body: |
            One git tag, four artifacts. The full release model is in
            [`RELEASES.md`](RELEASES.md). Three of the four artifacts are
            attached to this Release as files; Docker images live on
            ghcr.io.

            ## Artifacts

            ### Browser verifier (this Release, files below)

            - `chain_verifier_wasm_bg.wasm` — the verifier binary.
            - `chain_verifier_wasm.js` — ES module glue (wasm-bindgen `--target web`).
            - `chain-verifier.sha256` — sha256 of the `.wasm`, for reproducible-build checks.

            Validates the V1–V8 predicate on a chain fetched from a proxy's
            `:9091` chain API. Identical to the native Rust verifier in
            [`crates/chain-verifier-wasm/src/lib.rs`](crates/chain-verifier-wasm/src/lib.rs);
            same `serialize`, same `canonicalize`, same `verify_chain`. The
            unincorporated.app mothership pins this tag in
            `www/wasm-version.txt` + `www/scripts/sync-wasm.sh`.

            ### Per-role disk images (this Release, files below)

            - `uninc-proxy-${{ steps.tag.outputs.suffix }}.tar.gz` — proxy VM disk
              (Docker + `proxy:${{ steps.tag.outputs.tag }}` + nats + pgbouncer + caddy +
              compose YAML pre-baked).
            - `uninc-db-${{ steps.tag.outputs.suffix }}.tar.gz` — DB VM disk
              (Postgres 16 + MongoDB 8.0 + Docker + minio image).
            - `uninc-observer-${{ steps.tag.outputs.suffix }}.tar.gz` — observer VM disk
              (Docker + `observer:${{ steps.tag.outputs.tag }}` + compose YAML).

            Each tar.gz contains one bootable `disk.raw`. That's exactly the
            shape `gcloud compute images create --source-uri=gs://...`
            accepts; the same artifact also boots directly under qemu /
            KVM / Proxmox after `tar -xzf` and `qemu-img convert -f raw -O qcow2`.

            **Why baked images:** customer DB and observer VMs run on a
            private subnet with no Cloud NAT — first boot has zero internet
            egress, so every byte must be in the image. Distributed via
            GitHub Releases (this page) so no cloud-vendor registry is in
            the trust path; anyone can `curl` and `sha256sum` the artifact.
            See [`deploy/gcp/images/README.md`](deploy/gcp/images/README.md).

            ### Container images (ghcr.io, NOT here)

            - `ghcr.io/un-incorporated/proxy:${{ steps.tag.outputs.tag }}` — multi-arch (amd64+arm64)
              image carrying both `uninc-proxy` and `chain-engine` binaries
              (callers switch via entrypoint override).
            - `ghcr.io/un-incorporated/observer:${{ steps.tag.outputs.tag }}` — multi-arch observer.

            These are pulled by the disk-image bake above (so the disk-image
            hash and the container-image tag move in lockstep through one
            release). Self-hosters running Docker Compose pull them
            directly. Provenance + SBOM attestations attached by buildx.

            ### Terraform module (Git is the distribution)

            ```
            module "uninc" {
              source = "git::https://github.com/un-incorporated/server.git//deploy/gcp/modules/uninc-server?ref=${{ steps.tag.outputs.tag }}"
              # ...
            }
            ```

            ## CI workflow chain

            One tag push fires three workflows; release-images waits for
            release-docker so the disk-image bake can pull the matching
            container tag. Watch [Actions](https://github.com/un-incorporated/server/actions).

            ## Consuming this release

            See [`RELEASES.md`](RELEASES.md) for the full table and
            [`deploy/gcp/images/README.md`](deploy/gcp/images/README.md) for
            the lazy-import flow the managed `unincorporated.app`
            mothership uses to materialize the disk images into a customer's
            GCP project on first deploy of each tag.
