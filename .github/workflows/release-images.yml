# Build and publish per-role GCE images to Google Compute Engine on
# every semver tag push. Sibling workflow to release-docker.yml and
# release-wasm.yml — all three fire on the same `v*.*.*` trigger and
# fail independently.
#
# Images published per release:
#
#   uninc-proxy-vX-Y-Z      (image_family: uninc-proxy)
#   uninc-db-vX-Y-Z         (image_family: uninc-db)
#   uninc-observer-vX-Y-Z   (image_family: uninc-observer)
#
# Why per-role GCE images at all:
#
#   The DB and observer VMs run on the private subnet with no public
#   IP and no Cloud NAT. Without internet egress, they can't apt-get
#   install postgres or docker pull the observer container at first
#   boot. We pre-bake the runtime into the image so first boot is
#   config-only — read GCE metadata, render proxy.yml/observer.yml,
#   `docker compose up -d` against locally-cached images.
#
#   This also gives the protocol an attestable runtime artifact: each
#   image hash corresponds to a specific tag of this repo. Same trust
#   shape as the container images, applied to the entire VM.
#
# Required GitHub Actions secrets (configure in repo settings):
#
#   GCP_IMAGE_BUILD_PROJECT     — GCP project ID where images are
#                                 published. Both this repo's image
#                                 builds and the www mothership's VM
#                                 boots reference this same project,
#                                 so the mothership pulls images from
#                                 the same place this workflow pushes.
#   GCP_IMAGE_BUILD_SA_KEY      — JSON key for a service account with
#                                 roles/compute.instanceAdmin.v1 +
#                                 roles/iam.serviceAccountUser in
#                                 GCP_IMAGE_BUILD_PROJECT. Packer
#                                 needs these to spin up the builder
#                                 VM and create the image.

name: release-images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (must already exist as a git tag)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One matrix entry per role so a failure on one image doesn't
      # cancel the others — an observer build break shouldn't block
      # the proxy + db release from landing.
      fail-fast: false
      matrix:
        include:
          - role: proxy
            packer_file: deploy/gcp/images/proxy.pkr.hcl
          - role: db
            packer_file: deploy/gcp/images/db.pkr.hcl
          - role: observer
            packer_file: deploy/gcp/images/observer.pkr.hcl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_IMAGE_BUILD_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: Packer init
        run: packer init "${{ matrix.packer_file }}"

      - name: Packer build ${{ matrix.role }}
        run: |
          packer build \
            -var "version=${{ steps.tag.outputs.tag }}" \
            -var "project_id=${{ secrets.GCP_IMAGE_BUILD_PROJECT }}" \
            "${{ matrix.packer_file }}"

      - name: Summary
        run: |
          IMAGE_NAME="uninc-${{ matrix.role }}-$(echo '${{ steps.tag.outputs.tag }}' | tr . -)"
          echo "### uninc-${{ matrix.role }} published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- name: \`${IMAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- family: \`uninc-${{ matrix.role }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- project: \`${{ secrets.GCP_IMAGE_BUILD_PROJECT }}\`" >> $GITHUB_STEP_SUMMARY
