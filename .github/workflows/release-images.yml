# Build and publish per-role disk images to GitHub Releases on every
# semver tag push. Sibling workflow to release-docker.yml and
# release-wasm.yml — all three fire on the same `v*.*.*` trigger and
# fail independently.
#
# Output per release tag: three GitHub Release assets, one per role,
# each a tar.gz containing a single disk.raw bootable disk:
#
#   uninc-proxy-vX-Y-Z.tar.gz       (~1 GB compressed)
#   uninc-db-vX-Y-Z.tar.gz          (~1.5 GB compressed)
#   uninc-observer-vX-Y-Z.tar.gz    (~900 MB compressed)
#
# Why disk.raw + tar.gz: that's the format `gcloud compute images
# create --source-uri=...` accepts. The same artifact also boots
# directly under qemu/KVM/Proxmox after `tar -xzf` and renaming back
# to qcow2 → so self-hosters running on their own datacenter consume
# the identical artifact a managed-service customer's GCE VM does.
#
# No GCP credentials. No cloud-provider lock-in. The images don't
# touch GCP until a customer's mothership lazy-imports them on first
# deploy of each release tag (see www-side provisioning worker).
#
# Why per-role baked images at all:
#
#   The DB and observer VMs run on the private subnet with no public
#   IP and no Cloud NAT. Without internet egress, they can't apt-get
#   install postgres or docker pull the observer container at first
#   boot. We pre-bake the runtime into the image so first boot is
#   config-only — read GCE metadata, render proxy.yml/observer.yml,
#   `docker compose up -d` against locally-cached images.
#
#   This also gives the protocol an attestable runtime artifact: each
#   image hash corresponds to a specific tag of this repo, hosted on
#   GitHub where anyone can hash + verify it.

name: release-images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (must already exist as a git tag)'
        required: true

permissions:
  contents: write  # need write to upload Release assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One matrix entry per role so a failure on one image doesn't
      # cancel the others — an observer build break shouldn't block
      # the proxy + db release from landing.
      fail-fast: false
      matrix:
        include:
          - role: proxy
            packer_file: deploy/gcp/images/proxy.pkr.hcl
            build_dir: deploy/gcp/images/build/proxy
          - role: db
            packer_file: deploy/gcp/images/db.pkr.hcl
            build_dir: deploy/gcp/images/build/db
          - role: observer
            packer_file: deploy/gcp/images/observer.pkr.hcl
            build_dir: deploy/gcp/images/build/observer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
          # Image-name suffix follows GCE naming rules (no dots).
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          echo "suffix=$(echo "$TAG" | tr . -)" >> "$GITHUB_OUTPUT"

      # KVM acceleration on GitHub-hosted Linux runners has been
      # available since late 2024. Without /dev/kvm the qemu builder
      # falls back to TCG (software emulation) — much slower, but
      # still functional. We don't fail the build on missing KVM;
      # let it run and surface real failures from packer.
      - name: Install QEMU + virt tools
        run: |
          sudo apt-get update
          # qemu-system-x86 / qemu-utils — the qemu builder + qemu-img.
          # ovmf — UEFI firmware (Debian generic cloud images expect it).
          # xorriso — required by Packer's qemu builder to assemble the
          #   cidata CD ISO from cd_files/. ubuntu-latest doesn't ship
          #   any of xorriso / mkisofs / hdiutil / oscdimg by default,
          #   and Packer fails with "could not find a supported CD ISO
          #   creation command" within seconds if none is present.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xorriso

      - name: Enable /dev/kvm access for the runner
        run: |
          # GitHub-hosted ubuntu-latest runners expose /dev/kvm (nested
          # virtualization is enabled on the underlying Azure host) but
          # the device is mode 0660 root:kvm — the runner user isn't in
          # the kvm group, and `usermod -aG kvm $USER` doesn't take
          # effect within the same shell session. The cleanest fix in
          # CI is to chmod the device world-RW. This runner is
          # ephemeral and isolated, so the security impact of
          # `chmod 666 /dev/kvm` is bounded to the build job itself.
          ls -la /dev/kvm || true
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
          # Confirm KVM is actually usable from this user — `kvm-ok`
          # would be ideal but isn't always installed; this is the
          # cheap cross-check.
          test -r /dev/kvm && test -w /dev/kvm && echo "/dev/kvm OK"

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: Packer init
        run: packer init "${{ matrix.packer_file }}"

      - name: Wait for ghcr.io images at this tag
        if: matrix.role != 'db'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # release-docker.yml fires on the same v*.*.* tag and races
          # against this workflow. The qemu install scripts need to
          # `docker pull ghcr.io/un-incorporated/proxy:vX.Y.Z` (and
          # /observer for the observer role); if the image isn't on
          # ghcr.io yet, the build fails ~10min in after wasting most
          # of the per-role bake. Wait until both manifests resolve
          # before kicking off Packer.
          #
          # `db` doesn't depend on ghcr (it pulls minio/* from Docker
          # Hub which is a separate registry), so it skips this wait.
          #
          # Anonymous resolution requires the packages to be PUBLIC.
          # If a 404 persists after release-docker is green, flip the
          # ghcr package visibility to public — see images/README.md.
          set -euo pipefail
          IMAGES=("ghcr.io/un-incorporated/proxy:${TAG}")
          if [[ "${{ matrix.role }}" == "observer" ]]; then
            IMAGES=("ghcr.io/un-incorporated/observer:${TAG}")
          fi
          for IMG in "${IMAGES[@]}"; do
            echo "Waiting for $IMG ..."
            for i in $(seq 1 60); do
              if docker manifest inspect "$IMG" >/dev/null 2>&1; then
                echo "  $IMG resolved"
                break
              fi
              if [[ $i -eq 60 ]]; then
                echo "::error::$IMG did not appear within 30 minutes."
                echo "::error::Check release-docker.yml for this tag, and verify the package is public."
                exit 1
              fi
              sleep 30
            done
          done

      - name: Packer build ${{ matrix.role }}
        env:
          # Verbose Packer + qemu logs. The default packer error on a
          # qemu launch failure is "Qemu failed to start. Please run
          # with PACKER_LOG=1 to get more info." — easier to just
          # always have the logs and grep for failures than to debug
          # blind on a re-run.
          PACKER_LOG: 1
        run: |
          # Run from server repo root so $path.root inside the .pkr.hcl
          # resolves to deploy/gcp/images/, where install-*.sh and
          # files/ live.
          cd deploy/gcp/images
          packer build \
            -var "version=${{ steps.tag.outputs.tag }}" \
            "$(basename '${{ matrix.packer_file }}')"

      - name: Verify artifact exists + report size
        id: artifact
        run: |
          ARTIFACT="${{ matrix.build_dir }}/uninc-${{ matrix.role }}-${{ steps.tag.outputs.suffix }}.tar.gz"
          if [[ ! -f "$ARTIFACT" ]]; then
            echo "::error::expected $ARTIFACT, none produced"
            ls -la "${{ matrix.build_dir }}" || true
            exit 1
          fi
          SIZE_BYTES=$(stat -c '%s' "$ARTIFACT")
          SIZE_HUMAN=$(numfmt --to=iec --suffix=B "$SIZE_BYTES")
          echo "path=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_human=$SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          # GitHub Release asset hard cap is 2 GiB. If we cross it,
          # fail loud here rather than silently truncating uploads.
          if (( SIZE_BYTES > 2 * 1024 * 1024 * 1024 )); then
            echo "::error::${ARTIFACT} is ${SIZE_HUMAN}, exceeds GitHub Release 2GiB asset cap"
            exit 1
          fi
          # SHA-256 for the Release notes / verifiability story.
          SHA=$(sha256sum "$ARTIFACT" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ steps.artifact.outputs.path }}
          # Don't fail if the Release doesn't exist yet — this workflow
          # races release-docker.yml and release-wasm.yml on the same
          # tag; whichever finishes first creates the Release, the
          # rest append.
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Summary
        run: |
          {
            echo "### uninc-${{ matrix.role }} published"
            echo ""
            echo "- file: \`uninc-${{ matrix.role }}-${{ steps.tag.outputs.suffix }}.tar.gz\`"
            echo "- size: ${{ steps.artifact.outputs.size_human }}"
            echo "- sha256: \`${{ steps.artifact.outputs.sha256 }}\`"
            echo "- release: ${{ steps.tag.outputs.tag }}"
            echo ""
            echo "Customer mothership imports lazily on first deploy of this tag:"
            echo ""
            echo '```'
            echo "gcloud compute images create uninc-${{ matrix.role }}-${{ steps.tag.outputs.suffix }} \\"
            echo "  --source-uri=https://github.com/un-incorporated/server/releases/download/${{ steps.tag.outputs.tag }}/uninc-${{ matrix.role }}-${{ steps.tag.outputs.suffix }}.tar.gz \\"
            echo "  --project=\$GCP_PROJECT_ID"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
